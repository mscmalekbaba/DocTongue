[project]
name = "doctongue-backend"
version = "0.1.0"
description = "FastAPI backend for grounded document question answering"
requires-python = ">=3.12"
dependencies = [
  "deepeval>=2.9.7,<3.0.0",
  "chromadb>=1.0.15,<2.0.0",
  "fastapi>=0.116.1,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "pypdf>=5.7.0,<6.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "redis>=5.0.8,<6.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1,<9.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"